<!DOCTYPE html>
<html lang="en" data-theme="dark">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>404 · CyberAware</title>
  <link rel="preconnect" href="https://fonts.googleapis.com" />
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
  <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700&family=Plus+Jakarta+Sans:wght@700;800&display=swap" rel="stylesheet" />
  <script src="https://cdn.tailwindcss.com"></script>
  <link rel="stylesheet" href="../css/styles.css" />
</head>
<body>
  <div class="loader-overlay" id="page-loader">
    <div class="spinner"></div>
  </div>
  <div style="min-height:100vh;display:grid;place-items:center;padding:2rem" class="animate-in">
    <div class="card card-static text-center" style="max-width:480px;padding:3rem 2rem">
      <div style="font-size:4rem;font-weight:800" class="gradient-text">404</div>
      <h1 style="margin:0.75rem 0">Page not found</h1>
      <p class="text-muted mb-4">This URL isn't in our threat map. It may have moved, or the link is suspicious — verify before continuing.</p>
      <div class="empty-icon" style="margin-bottom:1.25rem">🛡️</div>
      <div class="flex gap-2 justify-center flex-wrap">
        <a href="../index.html" class="btn btn-primary">Go Home</a>
        <a href="dashboard.html" class="btn btn-secondary">Dashboard</a>
        <button class="btn btn-ghost" data-theme-toggle>Theme</button>
      </div>
    </div>
  </div>
  <script src="../js/app.js"></script>
</body>
</html>
