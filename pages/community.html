      /* =========================================================
     RISK BADGE
  ========================================================= */

      function riskBadge(risk) {
        if (risk === "Critical") {
          return "badge-danger";
        }

        if (risk === "High") {
          return "badge-warning";
        }

        return "badge-info";
      }

      /* =========================================================
     ESCAPE HTML
  ========================================================= */

      function escapeHtml(value) {
        return String(value ?? "")
          .replace(/&/g, "&amp;")
          .replace(/</g, "&lt;")
          .replace(/>/g, "&gt;")
          .replace(/"/g, "&quot;")
          .replace(/'/g, "&#039;");
      }

      /* =========================================================
     FORMAT FIRESTORE TIME
  ========================================================= */

      function formatAlertTime(timestamp) {
        if (!timestamp) {
          return "Recently";
        }

        try {
          let date;

          if (timestamp && typeof timestamp.toDate === "function") {
            date = timestamp.toDate();
          } else if (timestamp instanceof Date) {
            date = timestamp;
          } else {
            date = new Date(timestamp);
          }

          if (Number.isNaN(date.getTime())) {
            return "Recently";
          }

          const now = new Date();

          const difference = Math.floor(
            (now.getTime() - date.getTime()) / 1000,
          );

          if (difference < 60) {
            return "Just now";
          }

          if (difference < 3600) {
            const minutes = Math.floor(difference / 60);

            return `${minutes} min ago`;
          }

          if (difference < 86400) {
            const hours = Math.floor(difference / 3600);

            return `${hours} hr ago`;
          }

          if (difference < 604800) {
            const days = Math.floor(difference / 86400);

            return `${days} day${days === 1 ? "" : "s"} ago`;
          }

          return date.toLocaleDateString();
        } catch (error) {
          return "Recently";
        }
      }

      /* =========================================================
     LOAD REAL FIRESTORE ALERTS
  ========================================================= */

      async function loadFirebaseAlerts() {
        try {
          console.info(
            "[CyberAware] Loading real Firestore Alert Wall reports...",
          );

          if (typeof firebase === "undefined") {
            console.error("[CyberAware] Firebase is not available.");

            return;
          }

          if (typeof firebase.firestore !== "function") {
            console.error("[CyberAware] Firestore SDK is not loaded.");

            return;
          }

          const currentUser = firebase.auth().currentUser;

          if (!currentUser) {
            console.warn("[CyberAware] No logged-in user.");

            return;
          }

          console.info("[CyberAware] Reading alertWall for:", currentUser.uid);

          const db = firebase.firestore();

          const snapshot = await db.collection("alertWall").get();

          const realAlerts = [];

          snapshot.forEach((doc) => {
            const data = doc.data() || {};

            realAlerts.push({
              id: `firebase-${doc.id}`,

              firestoreId: doc.id,

              uid: data.uid || "",

              source: data.source || "community",

              title: data.title || "Reported Scam",

              body: data.body || "No description provided.",

              category: data.category || "Other",

              risk: data.risk || "High",

              riskScore: Number(data.riskScore || 0),

              author: data.author || "CyberAware Student",

              college: data.college || "CyberAware",

              likes: Number(data.likes || 0),

              comments: Number(data.comments || 0),

              verified: data.verified === true,

              trending: data.trending === true,

              aiExplanation: data.aiExplanation || "",

              keywords: Array.isArray(data.keywords) ? data.keywords : [],

              tips: Array.isArray(data.tips) ? data.tips : [],

              createdAt: data.createdAt || null,

              time: formatAlertTime(data.createdAt),
            });
          });

          /* Newest reports first */
          realAlerts.sort((first, second) => {
            const getTime = (item) => {
              if (
                item.createdAt &&
                typeof item.createdAt.toDate === "function"
              ) {
                return item.createdAt.toDate().getTime();
              }

              return 0;
            };

            return getTime(second) - getTime(first);
          });

          firebaseAlerts = realAlerts;

          firebaseLoaded = true;

          console.info(
            "[CyberAware] REAL reports loaded:",
            firebaseAlerts.length,
          );

          render();
        } catch (error) {
          console.error("[CyberAware] Failed to load Alert Wall:", error);

          App.toast("Could not load live Alert Wall reports.", "warning");
        }
      }

      /* =========================================================
     REAL POSTS ONLY
     NO DUMMY DATA
  ========================================================= */

      function allPosts() {
        return [...firebaseAlerts];
      }

     FILTER
  ========================================================= */

      function filtered() {
        const reports = allPosts();

        return reports.filter((post) => {
          const filterMatches =
            filter === "All" ||
            post.category === filter ||
            (filter === "Trending" && post.trending) ||
            (filter === "Verified" && post.verified);

          const searchableText = [
            post.title,
            post.body,
            post.category,
            post.author,
            post.college,
          ]
            .join(" ")
            .toLowerCase();

          const searchMatches =
            !search || searchableText.includes(search.toLowerCase());

          return filterMatches && searchMatches;
        });
      }
