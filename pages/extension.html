            panel.style.display = "none";
          }

          if (installButton) {
            installButton.textContent = "✓ Installation Steps Completed";

            installButton.classList.remove("btn-primary");

            installButton.classList.add("btn-success");
          }

          App.toast(
            "Installation steps marked as completed. Verify that CyberAware is enabled in Chrome.",

            "success",
          );
        };
      }
