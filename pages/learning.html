  /* =========================================================
     FIREBASE INITIALIZATION
  ========================================================= */

  async function waitForFirebase() {

    if (window.firebaseReady) {
      await window.firebaseReady;
    }

    let attempts = 0;

    while (
      (!window.firebaseApp || !window.firebase) &&
      attempts < 100
    ) {

      await new Promise(function(resolve) {
        setTimeout(resolve, 100);
      });

      attempts++;
    }

    if (!window.firebase || !window.firebaseApp) {
      throw new Error("Firebase initialization failed.");
    }

    return window.firebaseApp;
  }


  /* =========================================================
     CALCULATE STUDENT PROGRESS
  ========================================================= */

  function calculateProgress(completedModules) {

    const totalModules =
      Array.isArray(AppData.learningModules)
        ? AppData.learningModules.length
        : 8;

    const completedCount =
      Array.isArray(completedModules)
        ? completedModules.length
        : 0;

    const score =
      Math.round(
        (completedCount / totalModules) * 100
      );

    let level = "Beginner";

    if (score >= 80) {
      level = "Expert";
    }
    else if (score >= 50) {
      level = "Intermediate";
    }
    else if (score >= 25) {
      level = "Developing";
    }

    return {
      count: completedCount,
      score: score,
      level: level
    };
  }


  /* =========================================================
     LOAD STUDENT
  ========================================================= */

  async function loadStudent() {

    await waitForFirebase();

    auth = firebase.auth();
    db = firebase.firestore();

    return new Promise(function(resolve, reject) {

      auth.onAuthStateChanged(async function(user) {

        if (!user) {

          console.warn(
            "[CyberAware] No authenticated user."
          );

          window.location.href = "login.html";
          return;
        }

        try {

          await user.reload();

          currentUser = auth.currentUser;

          if (!currentUser) {
            window.location.href = "login.html";
            return;
          }


          const ref = db
            .collection("users")
            .doc(currentUser.uid);


          const snap = await ref.get();


          if (snap.exists) {

            studentData = snap.data();

          }

          else {

            studentData = {

              uid: currentUser.uid,

              email:
                currentUser.email || "",

              name:
                currentUser.displayName ||
                (currentUser.email || "Student")
                  .split("@")[0],

              role: "student",

              awarenessScore: 0,

              modulesCompleted: 0,

              quizzesCompleted: 0,

              certificates: 0,

              streak: 0,

              securityLevel: "Beginner",

              completedModules: []

            };


            await ref.set(
              {
                ...studentData,

                createdAt:
                  firebase.firestore.FieldValue.serverTimestamp(),

                updatedAt:
                  firebase.firestore.FieldValue.serverTimestamp()

              },
              {
                merge: true
              }
            );

          }


          /*
           * IMPORTANT:
           * completedModules is the source of truth.
           */

          if (
            !Array.isArray(
              studentData.completedModules
            )
          ) {

            studentData.completedModules = [];

          }


          /*
           * Remove duplicate module IDs.
           */

          studentData.completedModules =
            [...new Set(studentData.completedModules)];


          /*
           * Calculate progress from Firestore.
           */

          const progress =
            calculateProgress(
              studentData.completedModules
            );


          studentData.modulesCompleted =
            progress.count;

          studentData.awarenessScore =
            progress.score;

          studentData.securityLevel =
            progress.level;


          /*
           * Synchronize calculated values
           * back to Firestore.
           */

          await ref.set(
            {

              modulesCompleted:
                progress.count,

              awarenessScore:
                progress.score,

              securityLevel:
                progress.level,

              updatedAt:
                firebase.firestore.FieldValue.serverTimestamp()

            },
            {
              merge: true
            }
          );


          console.log(
            "[CyberAware] Student loaded:",
            studentData
          );


          resolve(true);

        }

        catch(error) {

          console.error(
            "[CyberAware] Student loading failed:",
            error
          );

          reject(error);

        }

      });

    });

  }


  /* =========================================================
     COMPLETE MODULE
  ========================================================= */

  async function completeModule(module) {

    if (
      !currentUser ||
      !db ||
      !studentData
    ) {

      App.toast(
        "Student session is not ready.",
        "error"
      );

      return;
    }


    const moduleId = module.id;


    let completed =
      Array.isArray(
        studentData.completedModules
      )
        ? studentData.completedModules
        : [];


    completed =
      [...new Set(completed)];


    /*
     * Already completed?
     */

    if (
      completed.includes(moduleId)
    ) {

      App.toast(
        "This module is already completed.",
        "info"
      );

      return;
    }


    /*
     * Add new module locally.
     */

    const updatedCompleted = [
      ...completed,
      moduleId
    ];


    const progress =
      calculateProgress(
        updatedCompleted
      );


    try {

      /*
       * Update Firestore.
       */

      await db
        .collection("users")
        .doc(currentUser.uid)
        .set(
          {

            completedModules:
              updatedCompleted,

            modulesCompleted:
              progress.count,

            awarenessScore:
              progress.score,

            securityLevel:
              progress.level,

            updatedAt:
              firebase.firestore.FieldValue.serverTimestamp()

          },
          {
            merge: true
          }
        );


      /*
       * Update browser memory.
       */

      studentData.completedModules =
        updatedCompleted;

      studentData.modulesCompleted =
        progress.count;

      studentData.awarenessScore =
        progress.score;

      studentData.securityLevel =
        progress.level;


      /*
       * Update AppData progress.
       */

      const localModule =
        AppData.learningModules.find(
          function(m) {
            return m.id === moduleId;
          }
        );


      if (localModule) {
        localModule.progress = 100;
      }


      /*
       * Success message.
       */

      App.toast(
        `${module.title} completed successfully!`,
        "success"
      );


      /*
       * Re-render current page.
       */

      renderDetail();


      console.log(
        "[CyberAware] Module completed:",
        moduleId
      );

      console.log(
        "[CyberAware] New progress:",
        progress
      );

    }

    catch(error) {

      console.error(
        "[CyberAware] Firestore update failed:",
        error
      );

      App.toast(
        "Could not save module progress. Check Firestore rules.",
        "error"
      );

    }

  }

          >
            ${module.icon}
          </div>


          <div style="flex:1">

            <div
              class="
                flex
                justify-between
                items-start
                gap-3
                flex-wrap
              "
            >

              <div>

                <h1
                  style="
                    font-size:1.8rem;
                    margin-bottom:.4rem;
                  "
                >
                  ${module.title}
                </h1>

                <p class="text-muted">
                  ${module.desc}
                </p>

              </div>


              <span
                class="
                  badge
                  ${
                    isCompleted
                      ? "badge-success"
                      : "badge-primary"
                  }
                "
              >

                ${
                  isCompleted
                    ? "Completed"
                    : "In Progress"
                }

              </span>

            </div>

          </div>

        </div>

      </div>


      <div class="grid-2">

        <!-- MAIN CONTENT -->

        <div>

          <!-- INTRODUCTION -->

          <div
            class="
              card
              card-static
              mb-4
            "
          >

            <h2
              style="
                font-size:1.3rem;
                margin-bottom:.8rem;
              "
            >
              📖 Introduction
            </h2>

            <p
              style="
                line-height:1.8;
                color:var(--text-secondary);
              "
            >
              ${content.introduction}
            </p>

          </div>


          <!-- CONCEPTS -->

          <div
            class="
              card
              card-static
              mb-4
            "
          >

            <h2
              style="
                font-size:1.3rem;
                margin-bottom:1rem;
              "
            >
              🎓 What You Will Learn
            </h2>


            <div
              style="
                display:flex;
                flex-direction:column;
                gap:1.2rem;
              "
            >

              ${
                content.concepts.map(
                  function(concept) {

                    return `

                      <div
                        style="
                          padding:1rem;
                          border:1px solid var(--border);
                          border-radius:14px;
                          background:var(--bg-elevated);
                        "
                      >

                        <h3
                          style="
                            margin-bottom:.5rem;
                          "
                        >
                          ${concept.title}
                        </h3>

                        <p
                          class="text-sm text-muted"
                          style="
                            line-height:1.8;
                          "
                        >
                          ${concept.text}
                        </p>

                      </div>

                    `;

                  }
                ).join("")
              }

            </div>

          </div>


          <!-- EXAMPLE -->

          <div
            class="
              card
              card-static
              mb-4
            "
            style="
              border-left:4px solid var(--primary);
            "
          >

            <h2
              style="
                font-size:1.2rem;
                margin-bottom:.7rem;
              "
            >
              💡 Real-Life Example
            </h2>

            <p
              class="text-sm"
              style="
                line-height:1.8;
              "
            >
              ${content.example}
            </p>

          </div>


          <!-- COMPLETE MODULE -->

          <div
            class="
              card
              card-static
              mb-4
            "
          >

            ${
              isCompleted

                ? `

                  <div
                    style="
                      text-align:center;
                      padding:1rem;
                    "
                  >

                    <div
                      style="
                        font-size:2.5rem;
                        margin-bottom:.5rem;
                      "
                    >
                      🎉
                    </div>

                    <h3>
                      Module Completed!
                    </h3>

                    <p
                      class="
                        text-sm
                        text-muted
                        mt-2
                      "
                    >
                      You have successfully completed
                      ${module.title}.
                    </p>

                  </div>

                `

                : `

                  <button
                    class="
                      btn
                      btn-primary
                      w-full
                    "
                    id="complete-module"
                  >
                    ✅ Complete Module
                  </button>

                `
            }

          </div>

        </div>


        <!-- SIDEBAR -->

        <div>

          <!-- SAFETY TIPS -->

          <div
            class="
              card
              card-static
              mb-4
            "
          >

            <h3
              style="
                margin-bottom:1rem;
              "
            >
              🛡️ Key Safety Tips
            </h3>


            <div
              style="
                display:flex;
                flex-direction:column;
                gap:.8rem;
              "
            >

              ${
                content.tips.map(
                  function(tip) {

                    return `

                      <div
                        class="
                          flex
                          gap-2
                          items-start
                        "
                      >

                        <span>
                          ✅
                        </span>

                        <span
                          class="text-sm"
                          style="
                            line-height:1.6;
                          "
                        >
                          ${tip}
                        </span>

                      </div>

                    `;

                  }
                ).join("")
              }

            </div>

          </div>


          <!-- PROGRESS -->

          <div
            class="
              card
              card-static
              mb-4
            "
          >

            <h3 class="mb-3">
              📊 Your Progress
            </h3>


            <div
              class="
                flex
                justify-between
                text-sm
                mb-2
              "
            >

              <span>
                ${module.title}
              </span>

              <strong>
                ${
                  isCompleted
                    ? "100%"
                    : "0%"
                }
              </strong>

            </div>


            <div class="progress">

              <div
                class="progress-bar"
                style="
                  width:${
                    isCompleted
                      ? 100
                      : 0
                  }%
                "
              ></div>

            </div>

          </div>


          <!-- QUIZ -->

          <div
            class="
              card
              card-static
            "
            style="
              background:var(--gradient-soft);
            "
          >

            <h3 class="mb-2">
              🏆 Test Your Knowledge
            </h3>

            <p
              class="
                text-sm
                text-muted
                mb-3
              "
            >
              After learning this topic,
              test yourself using the quiz section.
            </p>

            <a
              href="quiz.html"
              class="
                btn
                btn-secondary
                w-full
              "
            >
              Go to Quizzes →
            </a>

          </div>

        </div>

      </div>

    `;


    /* =========================================================
       BACK BUTTON
    ========================================================= */

    document
      .getElementById("back-button")
      .onclick =
      function() {

        activeModule = null;

        renderModules();

        window.scrollTo({
          top:0,
          behavior:"smooth"
        });

      };


    /* =========================================================
       COMPLETE BUTTON
    ========================================================= */

    const completeButton =
      document.getElementById(
        "complete-module"
      );


    if (completeButton) {

      completeButton.onclick =
        async function() {

          completeButton.disabled = true;

          completeButton.textContent =
            "Saving Progress...";


          await completeModule(module);

        };

    }


    hideLoader();

  }


  /* =========================================================
     HIDE LOADER
  ========================================================= */

  function hideLoader() {

    const loader =
      document.getElementById(
        "page-loader"
      );


    if (loader) {

      setTimeout(
        function() {

          loader.classList.add(
            "hidden"
          );

        },
        300
      );

    }

  }


  /* =========================================================
     START
  ========================================================= */

  async function start() {

    try {

      await loadStudent();

      buildLayout();

      renderModules();


      console.log(
        "[CyberAware] Learning Hub loaded successfully."
      );

      console.log(
        "[CyberAware] Modules completed:",
        studentData.modulesCompleted
      );

      console.log(
        "[CyberAware] Awareness score:",
        studentData.awarenessScore
      );

    }

    catch(error) {

      console.error(
        "[CyberAware] Learning Hub error:",
        error
      );


      document.getElementById(
        "app-root"
      ).innerHTML = `

        <div
          style="
            min-height:100vh;
            display:flex;
            justify-content:center;
            align-items:center;
            padding:2rem;
          "
        >

          <div
            class="card"
            style="
              max-width:550px;
              text-align:center;
            "
          >

            <div
              style="
                font-size:3rem;
                margin-bottom:1rem;
              "
            >
              ⚠️
            </div>

            <h2>
              Unable to Load Learning Hub
            </h2>

            <p
              class="text-muted"
              style="
                margin-top:.75rem;
                line-height:1.7;
              "
            >
              There was a problem loading your
              Firebase student profile.
              Please refresh the page.
            </p>

            <button
              class="btn btn-primary"
              style="margin-top:1rem"
              onclick="location.reload()"
            >
              Refresh Page
            </button>

          </div>

        </div>

      `;

    }

  }


  /* =========================================================
     RUN
  ========================================================= */

  start();

});

</script>

</body>
</html>
