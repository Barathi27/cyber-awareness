    <script>
      console.log("[CyberAware] Firebase Student Dashboard starting...");

      // =====================================================
      // GLOBAL VARIABLES
      // =====================================================

      let auth = null;

      let db = null;

      let currentUser = null;

      let studentData = null;

      // =====================================================
      // ANNOUNCEMENTS
      // =====================================================

      let announcements = [];

      // =====================================================
      // WAIT FOR FIREBASE
      // =====================================================

      async function waitForFirebase() {
        try {
          if (window.firebaseReady) {
            await window.firebaseReady;
          }

          let attempts = 0;

          while ((!window.firebaseApp || !window.firebase) && attempts < 100) {
            await new Promise(function (resolve) {
              setTimeout(resolve, 100);
            });

            attempts++;
          }

          if (!window.firebase || !window.firebaseApp) {
            throw new Error("Firebase was not initialized.");
          }

          console.log("[CyberAware] Firebase ready.");

          return true;
        } catch (error) {
          console.error("[CyberAware] Firebase startup error:", error);

          return false;
        }
      }

      // =====================================================
      // GET FIRESTORE STUDENT DATA
      // =====================================================

      async function loadStudentData(user) {
        try {
          if (!user) {
            throw new Error("No Firebase user found.");
          }

          db = firebase.firestore();

          const userRef = db.collection("users").doc(user.uid);

          console.log("[CyberAware] Reading Firestore:", user.uid);

          const snapshot = await userRef.get();

          if (!snapshot.exists) {
            console.error("[CyberAware] User document not found.");

            throw new Error("Your student profile was not found in Firestore.");
          }

          // ===============================================
          // GET FIRESTORE DATA
          // ===============================================

          studentData = snapshot.data();

          console.log("[CyberAware] Firestore student data:", studentData);

          // ===============================================
          // DEFAULT VALUES
          // ===============================================

          studentData.name = studentData.name || user.displayName || "Student";

          studentData.email = studentData.email || user.email || "";

          studentData.awarenessScore = Number(studentData.awarenessScore || 0);

          studentData.modulesCompleted = Number(
            studentData.modulesCompleted || 0,
          );

          studentData.quizzesCompleted = Number(
            studentData.quizzesCompleted || 0,
          );

          studentData.certificates = Number(studentData.certificates || 0);

          studentData.streak = Number(studentData.streak || 0);

          studentData.securityLevel = studentData.securityLevel || "Beginner";

          if (!Array.isArray(studentData.completedModules)) {
            studentData.completedModules = [];
          }

          return true;
        } catch (error) {
          console.error("[CyberAware] Failed to load student:", error);

          showError(error.message);

          return false;
        }
      }

      // =====================================================
      // LOAD ANNOUNCEMENTS FROM FIRESTORE
      // =====================================================

      async function loadAnnouncements() {
        try {
          if (!db) {
            db = firebase.firestore();
          }

          console.log("[CyberAware] Loading published announcements...");

          const snapshot = await db
            .collection("announcements")
            .where("published", "==", true)
            .get();

          announcements = [];

          snapshot.forEach(function (doc) {
            announcements.push({
              id: doc.id,
              ...doc.data(),
            });
          });

          // Newest announcements first
          announcements.sort(function (a, b) {
            const dateA =
              a.createdAt && typeof a.createdAt.toDate === "function"
                ? a.createdAt.toDate().getTime()
                : 0;

            const dateB =
              b.createdAt && typeof b.createdAt.toDate === "function"
                ? b.createdAt.toDate().getTime()
                : 0;

            return dateB - dateA;
          });

          console.log("[CyberAware] Announcements loaded:", announcements);

          return true;
        } catch (error) {
          console.error("[CyberAware] Failed to load announcements:", error);

          announcements = [];

          return false;
        }
      }

      // =====================================================
      // ESCAPE HTML
      // =====================================================

      function escapeHtml(value) {
        const div = document.createElement("div");

        div.textContent = value == null ? "" : String(value);

        return div.innerHTML;
      }

      // =====================================================
      // FORMAT ANNOUNCEMENT DATE
      // =====================================================

      function formatAnnouncementDate(timestamp) {
        if (timestamp && typeof timestamp.toDate === "function") {
          return timestamp.toDate().toLocaleString("en-IN", {
            day: "2-digit",
            month: "short",
            year: "numeric",
            hour: "2-digit",
            minute: "2-digit",
          });
        }

        return "Just now";
      }

      // =====================================================
      // RENDER STUDENT ANNOUNCEMENTS
      // =====================================================

      function renderStudentAnnouncements() {
        if (!announcements.length) {
          return `
            <div
              class="text-sm text-muted"
              style="
                padding:0.75rem;
                text-align:center;
              "
            >
              No new announcements at the moment.
            </div>
          `;
        }

        return announcements
          .map(function (announcement) {
            return `
              <div
                class="flex gap-3 items-start"
                style="
                  padding:0.85rem;
                  border:1px solid var(--border);
                  border-radius:12px;
                  background:var(--surface);
                "
              >

                <div
                  class="stat-icon"
                  style="
                    width:42px;
                    height:42px;
                    min-width:42px;
                    font-size:1.1rem;
                  "
                >
                  📢
                </div>

                <div style="flex:1;min-width:0;">

                  <strong class="text-sm">
                    Campus Announcement
                  </strong>

                  <p
                    class="text-sm"
                    style="
                      margin-top:0.35rem;
                      line-height:1.5;
                    "
                  >
                    ${escapeHtml(announcement.text || "")}
                  </p>

                  <div
                    class="text-xs text-muted"
                    style="margin-top:0.4rem;"
                  >
                    ${formatAnnouncementDate(announcement.createdAt)}
                  </div>

                </div>

              </div>
            `;
          })
          .join("");
      }

      // =====================================================
      // SHOW ERROR

      // =====================================================
      // START DASHBOARD
      // =====================================================

      async function startDashboard() {
        console.log("[CyberAware] Starting Firebase dashboard...");

        // ================================================
        // FIREBASE
        // ================================================

        const firebaseReady = await waitForFirebase();

        if (!firebaseReady) {
          showError("Firebase initialization failed.");

          return;
        }

        // ================================================
        // AUTH
        // ================================================

        try {
          auth = firebase.auth();
        } catch (error) {
          console.error("[CyberAware] Auth initialization failed:", error);

          showError("Firebase Authentication could not be initialized.");

          return;
        }

        // ================================================
        // AUTH STATE
        // ================================================

        auth.onAuthStateChanged(async function (user) {
          console.log(
            "[CyberAware] Auth state:",
            user ? user.email : "No user",
          );

          // ============================================
          // NOT LOGGED IN
          // ============================================

          if (!user) {
            console.log("[CyberAware] No logged-in user.");

            window.location.href = "login.html";

            return;
          }

          // ============================================
          // RELOAD USER
          // ============================================

          try {
            await user.reload();
          } catch (error) {
            console.warn("[CyberAware] User reload failed:", error);
          }

          currentUser = auth.currentUser;

          // ============================================
          // EMAIL VERIFICATION
          // ============================================

          if (!currentUser.emailVerified) {
            console.warn("[CyberAware] Email is not verified.");

            try {
              await auth.signOut();
            } catch (error) {
              console.error("[CyberAware] Signout error:", error);
            }

            window.location.href = "login.html";

            return;
          }

          // ============================================
          // LOAD FIRESTORE PROFILE
          // ============================================

          const loaded = await loadStudentData(currentUser);

          if (!loaded) {
            return;
          }

          // ============================================
          // LOAD ANNOUNCEMENTS
          // ============================================

          await loadAnnouncements();

          // ============================================
          // RENDER
          // ============================================

          renderDashboard();
        });
      }

      // =====================================================
      // RUN
      // =====================================================

      startDashboard();
